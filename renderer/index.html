<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self';">
<!--
  Hinweis style-src 'unsafe-inline': CodeMirror injiziert sein Theming zur
  Laufzeit über dynamisch erzeugte <style>-Elemente (style-mod) — fester
  Bestandteil der Bibliothek. script-src (sicherheitskritisch, verhindert
  Code-Ausführung) bleibt strikt auf 'self'.
-->
<title>Archiv Wiki</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/vendor/katex/katex.min.css">
</head>
<body>
  <div class="lock-screen" id="lockScreen" style="display:none;">
    <div class="lock-screen-box">
      <div class="lock-screen-icon">🔒</div>
      <h1 class="lock-screen-title">Archiv Wiki gesperrt</h1>
      <input type="password" id="lockScreenPassword" class="lock-screen-input" placeholder="Passwort" autocomplete="current-password">
      <div class="lock-screen-error" id="lockScreenError"></div>
      <button type="button" class="btn primary lock-screen-btn" id="lockScreenUnlock">Entsperren</button>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-resize-handle" id="sidebarResizeHandle"></div>
      <div class="sidebar-brand" id="sidebarBrand">
        <span id="sidebarBrandText"></span><span class="brand-cursor" aria-hidden="true"></span>
      </div>
      <!-- search-zone: gemeinsamer relativ positionierter Rahmen für Suchfeld,
           Scope/Filter-Zeile UND das Ergebnis-Dropdown (Schritt B1) — nötig,
           damit das Dropdown unterhalb ALLER drei Zeilen erscheint, statt die
           neue Scope/Filter-Zeile beim Tippen zu verdecken (das Dropdown liegt
           sonst genau darüber). -->
      <div class="search-zone">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="navSearch" placeholder="Durchsuchen…" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="searchDropdown" aria-autocomplete="list" aria-haspopup="listbox">
          <button type="button" class="search-clear" id="searchClear" title="Suche leeren" aria-label="Suche leeren">✕</button>
          <kbd>Ctrl K</kbd>
        </div>

        <!-- Suchbereich + Filter (Schritt B1) — bewusst als schmale zweite Zeile
             statt einer eigenen Suchseite: Scope schränkt EINE Suche gezielt auf
             ein Feld ein (kein Query-Syntax wie "tag:linux"), Filter grenzt
             unabhängig vom Suchtext nach Kategorie/Tags ein (funktioniert auch
             bei leerem Suchfeld). -->
        <div class="search-controls-row">
          <select id="searchScope" class="search-scope-select" aria-label="Suchbereich" title="Suchbereich">
            <option value="all">Alle</option>
            <option value="title">Titel</option>
            <option value="body">Inhalt</option>
            <option value="tags">Tags</option>
            <option value="categories">Kategorie</option>
          </select>
          <button type="button" id="searchFilterBtn" class="search-filter-btn" aria-haspopup="true" aria-expanded="false" title="Nach Kategorie/Tags filtern">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
            <span>Filter</span>
            <span class="search-filter-count" id="searchFilterCount" style="display:none;">0</span>
          </button>
          <div class="search-filter-panel" id="searchFilterPanel" style="display:none;"></div>
        </div>

        <div class="search-dropdown" id="searchDropdown" role="listbox" aria-label="Suchergebnisse" style="display:none;"></div>
      </div>
      <div class="active-filters-row" id="activeFiltersRow" style="display:none;"></div>

      <div class="action-row">
        <button type="button" class="action-btn" id="segAddMain" data-segment="main">+ Haupt</button>
        <button type="button" class="action-btn" id="segAddSub" data-segment="sub">+ Unter</button>
        <button type="button" class="action-btn action-btn-primary" id="btnAddNote">+ Notiz</button>
      </div>

      <ul class="nav-top">
        <li class="nav-home-row">
          <a class="nav-link" id="homeLink" data-route="home"><span class="nl-icon"><img class="lib-icon ui-nav-icon" src="assets/icon-library/navigation/home.svg" alt=""></span><span class="nl-title">Start</span></a>
          <button type="button" class="nav-home-lock" id="btnLockWiki" title="Wiki sperren" aria-label="Wiki sperren" hidden>
            <img class="lib-icon" src="assets/icon-library/network/shield.svg" alt="">
          </button>
        </li>
        <li><a class="nav-link" id="incomingLink" data-route="incoming"><span class="nl-icon"><img class="lib-icon ui-nav-icon" src="assets/icon-library/navigation/inbox.svg" alt=""></span><span class="nl-title">Eingang</span></a></li>
        <li><a class="nav-link" id="knowledgeCareLink" data-route="knowledge-care"><span class="nl-icon">✓</span><span class="nl-title">Wissenspflege</span></a></li>
      </ul>

      <div class="sidebar-scroll">
        <nav id="navTree"><!-- von app.js gerendert --></nav>
      </div>

      <div class="sidebar-foot-row">
        <div class="update-status" id="updateStatus">
          <div class="update-status-top" id="updateStatusTop">
            <span class="update-dot" id="updateDot"></span>
            <span class="update-status-label" id="updateStatusLabel">Wird geprüft …</span>
          </div>
          <div class="update-status-current" id="updateStatusCurrent"></div>
        </div>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <button class="burger" id="burgerBtn" type="button" aria-label="Menü">☰</button>
        <div class="breadcrumb" id="breadcrumb">Start</div>
        <span class="spacer"></span>
        <span class="topbar-dates" id="topbarNoteDates"></span>
        <button class="icon-btn" id="btnSync" type="button" title="Synchronisationseinstellungen" aria-label="Synchronisationseinstellungen"><img class="lib-icon ui-action-icon" src="assets/icon-library/network/cloud.svg" alt=""></button>
        <button class="icon-btn backup-warning-btn" id="btnBackupWarning" type="button" title="" aria-label="Backup-Warnung" style="display:none;"><img class="lib-icon" src="assets/icon-library/security/alert-triangle.svg" alt=""></button>
        <button class="icon-btn trash-btn" id="btnTrash" type="button" title="Papierkorb" aria-label="Papierkorb"><img class="lib-icon ui-action-icon" src="assets/icon-library/actions/trash.svg" alt=""><span class="trash-count" id="trashCount" style="display:none;"></span></button>
        <button class="icon-btn" id="btnBugReport" type="button" title="Fehler melden" aria-label="Fehler melden"><img class="lib-icon ui-action-icon" src="assets/icon-library/dev/bug.svg" alt=""></button>
        <button class="icon-btn" id="btnAbout" type="button" title="Über Archiv Wiki" aria-label="Über Archiv Wiki">ℹ</button>
        <span class="topbar-icon-divider"></span>
        <button class="icon-btn" id="btnSettings" type="button" title="Einstellungen" aria-label="Einstellungen"><img class="lib-icon ui-action-icon" src="assets/icon-library/projects/settings.svg" alt=""></button>
      </header>

      <main class="content-scroll" id="contentScroll">
        <!-- Home-Grid oder Notiz-Ansicht, gerendert von app.js -->
      </main>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
